name: CI

on:
  pull_request:
    branches: [ "master" ]
  push:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            lib/**/*.js
            lib/**/*.js.map
            lib/**/*.d.ts
            test/**/*.js
            test/**/*.js.map

  test-node:
    name: Test with Node.js
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build

      - name: Run Tests
        run: npm run test

  test-bun:
    name: Test with Bun ${{ matrix.bun-version }}
    runs-on: ubuntu-latest

    needs: build

    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.2.x", "1.3.x", "1.4.x"]

    steps:

      - name: 'Checkout the repository'
        uses: actions/checkout@v7

      - name: Setup Node.js for locked dependency installation
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build

      - name: Test with Bun ${{ matrix.bun-version }}
        run: bun run --bun test
